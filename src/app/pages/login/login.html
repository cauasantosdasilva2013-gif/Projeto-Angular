<header></header>

<main>
    <div class="lado-esquerdo">
        <img class="car" src="../img/ranger.png" alt="carro da ford">
     </div>

     <div class="lado-direito">

        <div class="login">
            <div class="Logo">
            <img src="img/ford.png" alt="logo">
        </div>
                <h2>Boa-Vindas</h2>

            <form (ngSubmit)="login()">

                <label for="email">E-mail</label>
                <input type="email" [(ngModel)]="usuario.nome" name="nome" id="email" placeholder="Digite seu e-mail">

                <label for="senha">senha</label>
                <input type="password" [(ngModel)]="usuario.senha" name="senha" id="Senha" placeholder="Digite sua senha">

                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>


</main>





    <footer></footer>
